<!doctype html>
<!-- facility-v3 GLB viewer for automated screenshot verification (img2threejs review gate) -->
<!-- art pass: PMREM IBL (RoomEnvironment), ACES tonemap, tight shadow frustum, sky-matched FogExp2 -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#a8bdd2}canvas{display:block}</style></head>
<body><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const SKY = new THREE.Color(0xa8bdd2);
const scene = new THREE.Scene();
scene.background = SKY;
scene.fog = new THREE.FogExp2(SKY.getHex(), 0.0007);
const cam = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 1, 4000);
cam.position.set(-340, 170, 380);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap; // PCFSoft deprecated in r184
document.body.appendChild(renderer.domElement);
// IBL: pre-filtered environment for PBR specular/diffuse (KB G3 — without it metals read flat).
// Kept at 0.45: full-strength RoomEnvironment fills shadows -> washed out (gate FAIL v1).
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.04; // key:fill ratio — shadows must dip <70 luma for gate
const sun = new THREE.DirectionalLight(0xfff2dd, 3.4);
sun.position.set(-450, 380, 320); // raking light: longer shadows read across the yard
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
// tight frustum around the 840x600 facility (KB G2: default frustum wastes texels)
sun.shadow.camera.left = -700; sun.shadow.camera.right = 700;
sun.shadow.camera.top = 700; sun.shadow.camera.bottom = -700;
sun.shadow.camera.near = 100; sun.shadow.camera.far = 1800;
sun.shadow.bias = -0.0005;
scene.add(sun, new THREE.HemisphereLight(SKY, 0x4a4842, 0.08));
// ground micro-variation (KB O G11: uniform background surfaces need noise — flat reads as
// plastic; amp <=0.05 terrain/rock class: this yard is compacted earth/asphalt, not finished
// concrete). Baked seeded seamless value-noise canvas textures instead of TSL node material:
// editor/tsl-probe.html proved TSL compiles headless under WebGPURenderer (WebGL2 fallback)
// but node lighting/shadows diverge from this tuned WebGLRenderer rig (probe ground ~luma 5).
// Multiply maps can only darken (texel <= 1.0), so noise is encoded around mean 0.75 with
// symmetric +/-amp and the material color divided by 0.75 — mean-preserving: tuned lighting
// untouched, variation only. Procedural (no image asset), LCG-seeded (deterministic, stable
// gate), wrapping lattice (seamless tiles).
function noiseTexture(mean, amp, seed) {
  const S = 256, G = 16, c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d'), img = ctx.createImageData(S, S);
  let s = seed >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const lat = new Float32Array(G * G);
  for (let i = 0; i < lat.length; i++) lat[i] = rnd();
  const sm = t => t * t * (3 - 2 * t);
  const oct = (u, v, g) => { // seamless value noise; lattice wraps so tiles are invisible
    const x = u * g, y = v * g, xi = Math.floor(x), yi = Math.floor(y);
    const fx = sm(x - xi), fy = sm(y - yi);
    const x0 = xi % G, y0 = yi % G, x1 = (x0 + 1) % G, y1 = (y0 + 1) % G;
    const a = lat[y0 * G + x0], b = lat[y0 * G + x1], d = lat[y1 * G + x0], e = lat[y1 * G + x1];
    return (a + (b - a) * fx) * (1 - fy) + (d + (e - d) * fx) * fy;
  };
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S;
    const n = oct(u, v, 4) * 0.35 + oct(u, v, 8) * 0.3 + oct(u, v, 16) * 0.2 + oct(u, v, 32) * 0.15;
    const m = mean + (n - 0.5) * 2 * amp; // symmetric span [mean-amp, mean+amp], mean exact
    const i = (y * S + x) * 4, g = Math.max(0, Math.min(255, Math.round(m * 255)));
    img.data[i] = img.data[i + 1] = img.data[i + 2] = g; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(60, 49); // ~37m tiles on the 2200x1800 ground -> 1.2-9m noise patches
  t.anisotropy = 8;
  return t; // NO colorspace tag: raw linear multiplier keeps the mean math exact
}
// albedo map: mean 0.75 +/- 0.05; material color = base/0.75 so mean albedo is exactly 0x5c594d
const gTex = noiseTexture(0.75, 0.05, 0x9e3779b9);
// roughness map: mean 0.9 +/- 0.04 with material.roughness 1.0 -> final span 0.86-0.94 (KB rough class)
const gRough = noiseTexture(0.9, 0.04, 0x85ebca6b);
// ground: darker warm asphalt tint (shadow pools must read <70 luma for gate)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2200, 1800), new THREE.MeshStandardMaterial({ color: 0x7b7567, roughness: 1.0, metalness: 0.0, map: gTex, roughnessMap: gRough }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);
// deterministic review camera; capture waits on __ready set AFTER GLB load
new GLTFLoader().load('./facility-v3.glb', (g) => {
  g.scene.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
  scene.add(g.scene);
  window.__ready = true;
}, undefined, (e) => { window.__err = String(e); });
window.addEventListener('error', e => window.__err = String(e.message));
(function loop(){ requestAnimationFrame(loop); renderer.render(scene, cam); })();
</script></body></html>
