<!-- Isolated object multiview inspector: renders one authored object from
     authoring/objects/<id>.json with rotation/distance variants and damage states.
     Query: ?obj=<objectId>&variant=<variantId>&view=front|side|rear|iso&dist=near|far|mid -->
<!doctype html><html><head><meta charset="utf-8"><title>VEXEA object inspector</title>
<style>html,body{margin:0;height:100%;background:#1b2229;overflow:hidden}#info{position:fixed;top:8px;left:8px;color:#b8c4d0;font:11px monospace;background:#0c1116cc;padding:4px 8px;border-radius:3px}</style>
</head><body><div id="info"></div>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const params = new URLSearchParams(location.search);
const objId = params.get('obj');
const variantId = params.get('variant') || 'clean';
const view = params.get('view') || 'iso';
const dist = params.get('dist') || 'mid';
document.getElementById('info').textContent = `${objId} · ${variantId} · ${view}/${dist}`;
const res = await fetch(`/authoring/objects/${objId}.json`);
const obj = await res.json();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a343d);
const key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(4, 8, 6); scene.add(key);
const fill = new THREE.DirectionalLight(0xa8bdd2, 1.1); fill.position.set(-6, 3, -4); scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const grid = new THREE.GridHelper(20, 20, 0x44525e, 0x36424c); grid.position.y = -0.001; scene.add(grid);

const texLoader = new THREE.TextureLoader();
const pbr = (name, rep, color, extra = {}) => {
  const m = new THREE.MeshStandardMaterial({ color: 0xffffff, ...extra });
  const set = (f, slot, srgb) => { const t = texLoader.load(`/assets/pbr/${name}-${f}.png`); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); if (srgb) t.colorSpace = THREE.SRGBColorSpace; m[slot] = t; };
  set('albedo', 'map', true); set('normal', 'normalMap', false); set('roughness', 'roughnessMap', false); set('metalness', 'metalnessMap', false);
  if (color !== undefined) { m.color = new THREE.Color(color); }
  return m;
};
const flat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, ...o });
const MATS = {
  'painted-steel': () => pbr('painted-steel', 2.2, undefined),
  'concrete': () => pbr('concrete', 2.0, undefined),
  'steel-dark': () => flat(0x4c565f, { roughness: 0.6, metalness: 0.7 }),
  'galvanized': () => flat(0x9aa5ad, { roughness: 0.45, metalness: 0.8 }),
  'aluminum': () => flat(0xb7bdc2, { roughness: 0.35, metalness: 0.85 }),
  'pmma': () => flat(0xcfd8dc, { roughness: 0.15, transparent: true, opacity: 0.45 }),
  'grey': () => flat(0x6e767d, { roughness: 0.7 }),
  'glass': () => flat(0x9fc4cf, { roughness: 0.08, metalness: 0.1, transparent: true, opacity: 0.42 }),
  'roof': () => flat(0x4b5350, { roughness: 0.9, metalness: 0.2 }),
  'lamp-head': () => flat(0xd8dee4, { roughness: 0.4 }),
  'safety-yellow': () => flat(0xc79a12, { roughness: 0.5 }),
  'safety-white': () => flat(0xd8dce0, { roughness: 0.5 }),
  'wood': () => flat(0x8a6b42, { roughness: 0.9 }),
  'drum-blue': () => flat(0x2a5d8f, { roughness: 0.45, metalness: 0.5 }),
  'drum-rust': () => flat(0x7a4a2a, { roughness: 0.8, metalness: 0.3 }),
  'drum-rib': () => flat(0x3d6b99, { roughness: 0.5, metalness: 0.55 }),
  'wet-asphalt': () => pbr('asphalt', 1.4, undefined, { roughness: 0.12, metalness: 0.35 }),
  'wet-sheen': () => flat(0x1d2126, { roughness: 0.08, metalness: 0.6, transparent: true, opacity: 0.85 }),
  'wet-film': () => flat(0x14171b, { roughness: 0.05, metalness: 0.75, transparent: true, opacity: 0.9 }),
  'wet-rim': () => flat(0x3a4148, { roughness: 0.4 }),
  'barrier-concrete': () => pbr('concrete', 1.2, undefined),
  'chainlink': () => flat(0x6e767d, { roughness: 0.4, metalness: 0.8, transparent: true, opacity: 0.45, side: THREE.DoubleSide, wireframe: true }),
  'fork-yellow': () => flat(0xc79012, { roughness: 0.45, metalness: 0.35 }),
  'paint-dark': () => flat(0x353b41, { roughness: 0.5, metalness: 0.5 }),
  'rubber': () => flat(0x1c1e20, { roughness: 0.95 }),
  'chrome': () => flat(0xc8cdd2, { roughness: 0.2, metalness: 0.95 }),
  'sign-plate': () => flat(0x39424b, { roughness: 0.55, metalness: 0.4 }),
  'sign-white': () => flat(0xdde2e6, { roughness: 0.5 }),
};
const [W, H, D] = obj.construction.size || [1, 1, 1];
const { buildObject } = await import('/tools/authoring/parts.mjs');
const variant = obj.variants.find(v => v.id === variantId) || obj.variants[0];
const built = buildObject(obj.construction, MATS, variant);
const group = built.group;
// center-bottom anchor: sit the object on the grid
const bb = new THREE.Box3().setFromObject(group);
group.position.y -= bb.min.y;
scene.add(group);

const span = Math.max(W, H, D);
const R = { near: span * 1.6, mid: span * 2.6, far: span * 4.5 }[dist] || span * 2.6;
const center = new THREE.Vector3(0, H / 2, 0);
const DIRS = {
  front: [0, 0.12, 1], rear: [0, 0.18, -1], side: [1, 0.1, 0],
  iso: [0.85, 0.65, 0.85], top: [0.01, 1, 0.35], low: [0.2, -0.05, 1],
};
const dir = new THREE.Vector3(...(DIRS[view] || DIRS.iso)).normalize();
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 2000);
cam.position.copy(center).addScaledVector(dir, R);
cam.lookAt(center);
renderer.render(scene, cam);
window.__inspectorReady = true;
</script></body></html>
