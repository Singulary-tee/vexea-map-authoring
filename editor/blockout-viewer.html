<!doctype html>
<!-- Full-map blockout viewer: built geometry, route cameras, X-ray interiors, and blockout reference. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:#10151b;font-family:monospace}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;top:10px;left:10px;background:#0c1116dd;padding:8px 10px;border-radius:4px;color:#b8c4d0;font-size:11px}
#ui button{margin-right:6px;background:#1b2733;color:#cfe0ee;border:1px solid #33475c;padding:3px 8px;border-radius:3px;cursor:pointer;font-family:monospace;font-size:11px}
#ui button.on{background:#2e5d7a}
#legend{margin-top:6px;line-height:1.5;white-space:pre}
.chip{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;border:1px solid #666}
</style></head>
<body><div id="ui">
<button id="bTop" class="on">TOP ORTHO</button><button id="bOrbit">ORBIT PERSP</button><button id="bXray">X-RAY</button><button id="bBlock">BLOCKOUT LAYER</button>
<div id="status" style="margin-top:5px;color:#82909d">BUILT GEOMETRY · blockout reference hidden</div>
<div id="legend"></div>
</div>
<script type="module">
const canvas = document.createElement('canvas');
const size = () => ({ width: Math.max(1, innerWidth), height: Math.max(1, innerHeight) });
const initialSize = size();
canvas.width = initialSize.width;
canvas.height = initialSize.height;
document.body.appendChild(canvas);

const worker = new Worker('./blockout-render-worker.js', { type: 'module' });
let ready = false;
let cameraKind = 'top';
let xray = false;
let blockoutVisible = false;
const post = message => worker.postMessage(message);

const bTop = document.getElementById('bTop');
const bOrbit = document.getElementById('bOrbit');
const bX = document.getElementById('bXray');
const bBlock = document.getElementById('bBlock');
const status = document.getElementById('status');
const setCameraButtons = top => {
  bTop.classList.toggle('on', top);
  bOrbit.classList.toggle('on', !top);
};
const setStatus = () => {
  status.textContent = blockoutVisible
    ? 'BUILT GEOMETRY · blockout reference visible'
    : 'BUILT GEOMETRY · blockout reference hidden';
};
const setTop = () => {
  cameraKind = 'top';
  setCameraButtons(true);
  post({ type: 'top' });
};
const setOrbit = () => {
  cameraKind = 'orbit';
  setCameraButtons(false);
  post({ type: 'orbit' });
};
const hideReference = () => {
  const changed = blockoutVisible;
  blockoutVisible = false;
  bBlock.classList.remove('on');
  setStatus();
  if (changed) post({ type: 'blockout', value: false });
};
const setPlayerMode = () => {
  cameraKind = 'player';
  setCameraButtons(false);
};

bTop.onclick = setTop;
bOrbit.onclick = setOrbit;
bX.onclick = () => {
  xray = !xray;
  bX.classList.toggle('on', xray);
  post({ type: 'xray', value: xray });
};
bBlock.onclick = () => {
  blockoutVisible = !blockoutVisible;
  bBlock.classList.toggle('on', blockoutVisible);
  setStatus();
  post({ type: 'blockout', value: blockoutVisible });
};

window.__forceRender = () => post({ type: 'force' });
window.__hideReference = hideReference;
window.__viewerState = () => ({
  ready,
  blockoutVisible,
  blockoutButtonOn: bBlock.classList.contains('on'),
  xray,
  camera: cameraKind === 'top' ? 'top' : 'perspective',
});

function routePoints(route) {
  const points = [];
  for (let i = 0; i < route.length - 1; i++) {
    const a = route[i], b = route[i + 1];
    const count = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 8));
    for (let k = 0; k < count; k++) points.push([a[0] + (b[0] - a[0]) * k / count, a[1] + (b[1] - a[1]) * k / count]);
  }
  points.push(route[route.length - 1]);
  return points;
}
const ROUTE = routePoints([[-292, 170], [-240, 160], [-160, 150], [-60, 120], [0, 100], [60, 60], [120, 0], [140, -60], [110, -110], [100, -160], [100, -210], [40, -214], [20, -222], [20, -228]]);
const SLICE = routePoints([[-120, 80], [-80, 60], [-40, 40], [0, 10], [40, -40], [60, -100], [50, -150], [48, -190]]);
window.__playerCamAt = t => {
  hideReference();
  setPlayerMode();
  const i = Math.min(ROUTE.length - 2, Math.floor(t * (ROUTE.length - 1)));
  const p = ROUTE[i], q = ROUTE[Math.min(i + 2, ROUTE.length - 1)];
  post({ type: 'player-pose', x: p[0], z: p[1], targetX: q[0], targetZ: q[1], y: 1.7 });
};
window.__playerCamPose = (x, z, targetX, targetZ, y = 1.7) => {
  hideReference();
  setPlayerMode();
  post({ type: 'player-pose', x, z, targetX, targetZ, y });
};
const INTERIORS = {
  'core-objective': true,
  'loading-hall': true,
  tunnel: true,
  'security-hall': true,
  maintenance: true,
};
window.__interiorCam = name => {
  if (!INTERIORS[name]) return false;
  hideReference();
  setPlayerMode();
  post({ type: 'interior', name });
  return true;
};
window.__sliceCamAt = t => {
  hideReference();
  setPlayerMode();
  const i = Math.min(SLICE.length - 2, Math.floor(t * (SLICE.length - 1)));
  const p = SLICE[i], q = SLICE[Math.min(i + 2, SLICE.length - 1)];
  post({ type: 'player-pose', x: p[0], z: p[1], targetX: q[0], targetZ: q[1], y: 1.7 });
};

let pointerId = null;
let previousPointer = null;
canvas.addEventListener('pointerdown', event => {
  if (cameraKind !== 'orbit') return;
  pointerId = event.pointerId;
  previousPointer = [event.clientX, event.clientY];
  canvas.setPointerCapture(pointerId);
});
canvas.addEventListener('pointermove', event => {
  if (event.pointerId !== pointerId || !previousPointer) return;
  const dx = event.clientX - previousPointer[0];
  const dy = event.clientY - previousPointer[1];
  previousPointer = [event.clientX, event.clientY];
  post({ type: 'orbit-delta', dx, dy });
});
const endPointer = event => {
  if (event.pointerId !== pointerId) return;
  pointerId = null;
  previousPointer = null;
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', event => {
  if (cameraKind === 'orbit') post({ type: 'orbit-zoom', delta: event.deltaY });
}, { passive: true });

worker.onmessage = event => {
  const message = event.data;
  if (message.type === 'ready') {
    ready = true;
    window.__ready = true;
    return;
  }
  if (message.type === 'error') {
    window.__err = message.message || 'render worker failed';
    status.textContent = `RENDER ERROR · ${window.__err}`;
  }
};
worker.onerror = event => {
  window.__err = event.message || 'render worker failed';
  status.textContent = `RENDER ERROR · ${window.__err}`;
};

window.addEventListener('resize', () => {
  const next = size();
  post({ type: 'resize', width: next.width, height: next.height });
});
const LEG = [['#6e6a5a','ground'],['#3a5a7c','enterable bldg'],['#46688c','warehouse'],['#4a5560','non-enterable'],['#5b4a8c','tower'],['#2e8c8c','bridge'],['#7a6a4a','wall/fence'],['#c07a2e','stair'],['#d08a3a','incline'],['#b06030','roll-down door'],['#8a5ab8','tunnel (X-ray)'],['#d84a8c','drone hole'],['#e0c040','entrance'],['#3f7a45','cover'],['#5a9a5a','canopy'],['#5a4a3a','mountain'],['#2e5d7a','water'],['#40c0c0','spawn'],['#d04040','kill-zone']];
document.getElementById('legend').innerHTML = LEG.map(([color, name]) => `<span class="chip" style="background:${color}"></span>${name}`).join('<br>');
const offscreen = canvas.transferControlToOffscreen();
worker.postMessage({ type: 'init', canvas: offscreen, width: initialSize.width, height: initialSize.height }, [offscreen]);
</script></body></html>
