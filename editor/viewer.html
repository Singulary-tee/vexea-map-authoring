<!doctype html>
<!-- facility-v3 GLB viewer for automated screenshot verification (img2threejs review gate) -->
<!-- art pass: PMREM IBL (RoomEnvironment), ACES tonemap, tight shadow frustum, sky-matched FogExp2 -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#a8bdd2}canvas{display:block}</style></head>
<body><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const SKY = new THREE.Color(0xa8bdd2);
const scene = new THREE.Scene();
scene.background = SKY;
scene.fog = new THREE.FogExp2(SKY.getHex(), 0.0007);
const cam = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 1, 4000);
cam.position.set(-340, 170, 380);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap; // PCFSoft deprecated in r184
document.body.appendChild(renderer.domElement);
// IBL: pre-filtered environment for PBR specular/diffuse (KB G3 — without it metals read flat).
// Kept at 0.45: full-strength RoomEnvironment fills shadows -> washed out (gate FAIL v1).
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.04; // key:fill ratio — shadows must dip <70 luma for gate
const sun = new THREE.DirectionalLight(0xfff2dd, 3.4);
sun.position.set(-450, 380, 320); // raking light: longer shadows read across the yard
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
// tight frustum around the 840x600 facility (KB G2: default frustum wastes texels)
sun.shadow.camera.left = -700; sun.shadow.camera.right = 700;
sun.shadow.camera.top = 700; sun.shadow.camera.bottom = -700;
sun.shadow.camera.near = 100; sun.shadow.camera.far = 1800;
sun.shadow.bias = -0.0005;
scene.add(sun, new THREE.HemisphereLight(SKY, 0x4a4842, 0.08));
// ground: darker warm asphalt tint (shadow pools must read <70 luma for gate)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2200, 1800), new THREE.MeshStandardMaterial({ color: 0x5c594d, roughness: 0.96, metalness: 0.0 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);
// deterministic review camera; capture waits on __ready set AFTER GLB load
new GLTFLoader().load('./facility-v3.glb', (g) => {
  g.scene.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
  scene.add(g.scene);
  window.__ready = true;
}, undefined, (e) => { window.__err = String(e); });
window.addEventListener('error', e => window.__err = String(e.message));
(function loop(){ requestAnimationFrame(loop); renderer.render(scene, cam); })();
</script></body></html>
