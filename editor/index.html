<!doctype html>
<!-- VEXEA Map Editor — STANDALONE, LLM-optimized. Not part of the game render path.
     Authors vexea-map/0.1 JSON (see ../spec/map-schema.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>VEXEA Map Editor (standalone)</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#ddd;font:13px/1.4 monospace}
  #app{display:flex;height:100%}
  #side{width:260px;overflow-y:auto;background:#1a1a1a;padding:10px;border-right:1px solid #333}
  #view{flex:1;position:relative}
  .lyr{display:flex;align-items:center;gap:6px;margin:4px 0}
  .sw{width:14px;height:14px;border:1px solid #555}
  button{background:#2a2a2a;color:#ddd;border:1px solid #444;padding:4px 8px;margin:2px 0;cursor:pointer;font:inherit}
  pre{white-space:pre-wrap;color:#8f8}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
"three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
"three/tsl":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="app">
  <div id="side">
    <b>VEXEA Map Editor</b> <span id="status">loading…</span>
    <div><input type="file" id="file" accept=".json"></div>
    <div id="layers"></div>
    <button id="sim">toggle sim overlay</button>
    <button id="export">export JSON</button>
    <pre id="log"></pre>
  </div>
  <div id="view"></div>
</div>
<script type="module">
import * as THREE from 'three/webgpu';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
// Blockout renderer: category -> color. Ground drawn as thin pads; volumes as wire+solid.
const CAT_COLOR = { 'ground-surface-type':0x5a5a5a,'warehouse-enterable':0x8a5a2a,
  'building-enterable':0x6a7a8a,'service-pressure':0x9a8a3a,'wall-blocking':0x3a4a5a,
  'entrance-player':0x2a8a2a,'cover':0x2a6a2a,'kill-zone':0xaa2a2a,'spawn':0x6a2a8a,
  'overhead-cover':0x2a9a9a,'bridge':0x8a8a8a,'tunnel-passage':0x3a3a4a,
  'hole-drone-entry':0xaa6a2a,'mountain-boundary':0x6a5a4a,'waterbody-boundary':0x2a4a9a,
  'stair':0x9a5a5a,'incline':0x9a7a5a,'tower':0x5a5a9a,'facade-non-enterable':0x4a4a4a };
const FALLBACK=0x55aaff;
let spec=null, scene, renderer, camera, controls;
const layerGroups={};
function log(m){ document.getElementById('log').textContent += m+'\n'; }
function status(s){ document.getElementById('status').textContent=s; }
async function init(){
  renderer = new THREE.WebGPURenderer({ antialias:true });
  await renderer.init();
  renderer.setSize(innerWidth-260, innerHeight);
  document.getElementById('view').appendChild(renderer.domElement);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e1013);
  scene.fog = new THREE.Fog(0x0e1013, 400, 1200);
  const hemi=new THREE.HemisphereLight(0x8899bb,0x332211,0.7); scene.add(hemi);
  const key=new THREE.DirectionalLight(0xffffff,1.2); key.position.set(150,300,-150); scene.add(key);
  camera = new THREE.PerspectiveCamera(55, (innerWidth-260)/innerHeight, 0.1, 4000);
  camera.position.set(144,140,400);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(144,0,360);
  addEventListener('resize', ()=>{ renderer.setSize(innerWidth-260,innerHeight);
    camera.aspect=(innerWidth-260)/innerHeight; camera.updateProjectionMatrix(); });
  renderer.setAnimationLoop(()=>{ controls.update(); renderer.render(scene,camera); });
  status('ready');
}
function clearGroups(){ for(const k in layerGroups){ scene.remove(layerGroups[k]); delete layerGroups[k]; } }
function segCategory(s){ return s.category || 'unknown'; }
function boxFromBounds(s){
  const [minX,minZ]=s.bounds.min,[maxX,maxZ]=s.bounds.max;
  const w=maxX-minX, d=maxZ-minZ, h=s.height||(s.bounds.h?.max??4);
  const y = (s.bounds.y ? s.bounds.y.min : (s.category==='ground-surface-type'?0:0));
  const geo=new THREE.BoxGeometry(w,h,d);
  const mat=new THREE.MeshStandardMaterial({ color:CAT_COLOR[segCategory(s)]||FALLBACK,
    transparent:true, opacity:s.category==='ground-surface-type'?0.55:(s.category==='cover'?0.7:0.85),
    roughness:0.9 });
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set((minX+maxX)/2, y+h/2, (minZ+maxZ)/2);
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color:0x111111, transparent:true, opacity:0.6 }));
  mesh.add(edges);
  mesh.name=s.id;
  return mesh;
}
function buildBlocks(){
  const g=new THREE.Group(); g.name='segments';
  for(const s of (spec?.segments??[])){ if(s.bounds) g.add(boxFromBounds(s)); }
  scene.add(g); layerGroups['segments']=g;
}
function buildUI(){
  const box=document.getElementById('layers'); box.innerHTML='';
  const names=Object.keys(CAT_COLOR);
  for(const name of names){
    const row=document.createElement('div'); row.className='lyr';
    const sw=document.createElement('span'); sw.className='sw';
    sw.style.background='#'+CAT_COLOR[name].toString(16).padStart(6,'0');
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=true;
    cb.onchange=()=>{ // filter visible by category (store on group children)
      for(const m of (layerGroups['segments']?.children??[])){
        const cat=m.userData?.cat;
        if(cat===name) m.visible=cb.checked;
      } };
    row.append(cb,sw,document.createTextNode(name)); box.appendChild(row);
  }
  // attach category to each mesh for filtering
  for(const s of (spec?.segments??[])){
    if(!s.bounds) continue;
    const m=layerGroups['segments']?.children.find(c=>c.name===s.id);
    if(m) m.userData={cat:segCategory(s)};
  }
}
function load(specObj){
  spec=specObj; clearGroups(); if(spec?.segments) buildBlocks(); buildUI();
  status('loaded '+(spec?.slice||spec?.id||'?')+' ('+(spec?.segments?.length||0)+' segments)');
}
document.getElementById('file').onchange = async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ load(JSON.parse(await f.text())); }catch(err){ log('ERR '+err.message); }
};
document.getElementById('export').onclick = ()=>{
  const blob=new Blob([JSON.stringify(spec,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(spec?.slice||spec?.id||'blockout')+'.json'; a.click();
};
document.getElementById('sim').onclick = ()=>log('sim: run node tools/blockout-validate.mjs on this file');
init();
if(location.protocol.startsWith('http')){
  fetch('./../blockout/blockout-slice-cw.json').then(r=>r.ok?r.json():null).then(s=>{ if(s) load(s); }).catch(()=>{});
}
</script>
</body>
</html>
